# Redis config fragment for the Kumbuild VPS (backend/README.md §2, §6.6).
#
# 1GB memory budget: Go API ~16MB peak + Postgres ~370MB + cloudflared
# ~10-20MB + Redis 64MB (maxmemory below) + nginx ~10MB = ~480MB, inside
# 1GB with a 1GB swap file as safety net. Redis holds ONLY ephemeral data
# (login rate-limit counters, OTP attempt counters, Turnstile throttling
# cache — all with TTLs). Sessions live in Postgres, never here.
#
# Install: the deploy workflow copies this fragment over the packaged
# redis.conf and restarts redis. Oracle Linux / EPEL: service ka naam
# `redis` hai (Debian wale `redis-server` service nahi). Redis listens on
# localhost only; there is no public port.

bind 127.0.0.1
protected-mode yes
port 6379
maxmemory 64mb
maxmemory-policy allkeys-lru

# Ephemeral-only data: no RDB snapshots, no AOF. A restart loses counters,
# which is safe — rate limits just start fresh.
save ""
appendonly no

# systemd manages the process; Redis must not daemonize itself.
daemonize no
supervised systemd

# requirepass is set by the deploy workflow (sed from the REDIS_PASSWORD
# secret) — Redis config files do NOT expand environment variables, so do
# not write ${REDIS_PASSWORD} here.
# requirepass CHANGE_ME
