# Kumbuild — deploy kumbuild-app (Next.js static export) to Cloudflare Pages.
# Trigger: push to main (app ya shared packages badle to) ya manual dispatch.
# App sirf STATIC hai (output: "export", koi Worker nahi): build se out/
# banta hai, wrangler pages deploy use seedha Pages project me daalta hai.
# `wrangler pages project create` pehli baar project bana deta hai (agar
# pehle se ho to fail hota hai — isliye `|| true`); uske baad har deploy
# usi project ko update karta hai. `--production-branch main` LAZMI hai —
# bina iske create fail hota hai ("Missing production branch", run
# 42638972326 step 6) aur `|| true` ke peeche chhup jata hai, phir deploy
# step "project does not exist" se girta hai.
# chahiye (Workers permission ki zaroorat NAHI — wahi purana token error
# is setup me aata hi nahi).
# NOTE (verified): git-database API se kiye gaye push `push` trigger
# CHALATE hain (runs 42619040189/42619040220/42619755398) — Creestion
# wala gotcha yahan lagu nahi hota.
name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/app/**"
      - "frontend/packages/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure Pages project exists
        run: pnpm exec wrangler pages project create kumbuild-app --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter kumbuild-app build
      - name: Deploy static export to Pages
        run: pnpm exec wrangler pages deploy frontend/apps/app/out --project-name=kumbuild-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
