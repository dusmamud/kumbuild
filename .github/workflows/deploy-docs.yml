# Kumbuild — deploy kumbuild-docs (Astro 7 + Starlight) to Cloudflare Pages.
# Project `kumbuild-docs-4fs` Dus apne main Cloudflare account me banayega;
# custom domain docs.kumbuild.com production me Dus khud add karega.
# Trigger: push to main (docs ya shared packages badle to) ya manual.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/docs/**"
      - "frontend/packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — full history, so Starlight's git-based
      # `lastUpdated` shows each file's true date instead of the deploy
      # date on every page (audit F11). Shallow checkout (depth 1) made
      # every live page say the deploy date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kumbuild-docs build
      - run: pnpm exec wrangler pages deploy frontend/apps/docs/dist --project-name=kumbuild-docs-4fs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
