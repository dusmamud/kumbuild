# Kumbuild — one-off PostgreSQL setup on the Oracle VPS (Dusrel-chat).
#
# Run manually: Actions -> Setup PostgreSQL on VPS -> Run workflow.
# Uses the same VPS secrets as deploy-backend.yml (VPS_HOST, VPS_USER,
# VPS_SSH_KEY, VPS_PORT). Installs PostgreSQL on Oracle Linux 9, tunes it
# for 1 GB RAM, creates database + user 'kumbuild', and a 1 GB swap file.
# The database password is generated on the VPS and stored ONLY there at
# /etc/kumbuild/db-password (0600) — it is never printed in logs.
name: Setup PostgreSQL on VPS

on:
  workflow_dispatch:

jobs:
  setup-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL and prepare VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            echo "--- OS / memory / disk ---"
            cat /etc/os-release | head -3
            free -h
            df -h / | tail -1
            echo "--- PostgreSQL already installed? ---"
            psql --version || echo "psql not present yet"
            systemctl is-active postgresql || echo "postgresql service not running yet"

            echo "--- cleanup orphaned dnf from killed runs ---"
            echo "top memory users before cleanup:"; ps aux --sort=-%mem | head -12; free -h
            if pgrep -x dnf >/dev/null 2>&1; then
              echo "stale dnf process found, killing it"
              sudo pkill -x dnf || true
              sleep 5
            fi
            sudo pkill -x rpm || true
            sudo rm -f /var/cache/dnf/*lock* /var/lib/dnf/rpmdb_lock.pid 2>/dev/null || true
            echo "dnf lock check:"; ps aux | grep -i '[d]nf' || echo "no dnf process running"
            echo "--- disable dnf-makecache timer: it ate 570MB RAM on this 1GB box (2026-11-12 run) ---"
            sudo systemctl disable --now dnf-makecache.timer 2>/dev/null || echo "dnf-makecache.timer not present/disabled"
            echo "top memory users after cleanup:"; ps aux --sort=-%mem | head -8; free -h
            echo "--- extra swap: dnf was OOM-killed on 2026-11-11 with only 48Mi RAM free (945Mi total, 780Mi swap used) ---"
            if [ "$(free -m | awk '/^Swap:/ {print $2}')" -lt 2048 ]; then
              if [ ! -f /swapfile2 ]; then sudo fallocate -l 1G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2; fi
              sudo swapon /swapfile2 || echo "swapfile2 already on"
              grep -q '^/swapfile2' /etc/fstab || echo '/swapfile2 none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
            fi
            free -h
            sudo dnf clean all || true

            echo "--- Install PostgreSQL (Oracle Linux 9, dnf; no makecache: dnf install refreshes metadata itself, makecache wasted 10 min stalled on 2026-11-11) ---"
            echo "--- dnf install postgresql (retry loop, 3 x 1500s timeout; --setopt timeout/minrate fail-fast on stalled mirrors, -v shows progress; single 600s run was killed at timeout on 2026-11-11; no module enable: module enable hung with no output) ---"
            INSTALL_OK=0
            for attempt in 1 2 3; do
              echo "dnf install attempt $attempt/3"
              rc=0
              sudo timeout 1500 dnf --disablerepo=ol9_ksplice,ol9_oci_included --setopt=timeout=30 --setopt=minrate=1000 --setopt=max_parallel_downloads=1 -v install -y postgresql-server postgresql-contrib || rc=$?
              if [ "$rc" -eq 0 ]; then
                INSTALL_OK=1
                break
              fi
              echo "attempt $attempt failed rc=$rc; retrying in 15s"
              sleep 15
            done
            [ "$INSTALL_OK" -eq 1 ] || { echo "dnf install failed after 3 attempts"; exit 1; }
            rpm -q postgresql-server || exit 1
            if [ ! -s /var/lib/pgsql/data/PG_VERSION ]; then
              sudo /usr/bin/postgresql-setup --initdb
            fi
            sudo systemctl enable --now postgresql

            echo "--- Tune for 1 GB RAM (Kumbuild backend plan) ---"
            CONF=/var/lib/pgsql/data/postgresql.conf
            for kv in "shared_buffers=192MB" "effective_cache_size=512MB" "work_mem=4MB" "maintenance_work_mem=64MB" "max_connections=30" "max_wal_size=1GB" "autovacuum=on"; do
              key="${kv%%=*}"
              sudo sed -i "/^#*${key}\s*=/d" "$CONF"
              echo "$kv" | sudo tee -a "$CONF" >/dev/null
            done
            echo "--- pg_hba: TCP password auth (default host lines are ident, which rejects PGPASSWORD + the Go driver) ---"
            sudo sed -i 's/^host\(.*\)ident$/host\1scram-sha-256/' /var/lib/pgsql/data/pg_hba.conf
            grep -E '^host' /var/lib/pgsql/data/pg_hba.conf || true
            sudo systemctl restart postgresql
            systemctl is-active postgresql

            echo "--- Create kumbuild OS user (for later API deploy) ---"
            id kumbuild >/dev/null 2>&1 || sudo useradd -m -s /bin/bash kumbuild

            echo "--- Create database + user kumbuild ---"
            sudo install -d -m 0755 /etc/kumbuild
            if [ -f /etc/kumbuild/db-password ]; then
              DB_PASS=$(sudo cat /etc/kumbuild/db-password)
            else
              DB_PASS=$(openssl rand -hex 16)
              echo "$DB_PASS" | sudo tee /etc/kumbuild/db-password >/dev/null
              sudo chmod 0600 /etc/kumbuild/db-password
            fi
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='kumbuild') THEN CREATE USER kumbuild WITH PASSWORD '$DB_PASS'; ELSE ALTER USER kumbuild WITH PASSWORD '$DB_PASS'; END IF; END \$\$;"
            sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='kumbuild'" | grep -q 1 || sudo -u postgres psql -c "CREATE DATABASE kumbuild OWNER kumbuild;"

            echo "--- 1 GB swap file if none ---"
            if [ "$(swapon --show | wc -l)" -eq 0 ]; then
              sudo fallocate -l 1G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
            fi

            echo "--- Verify ---"
            psql --version
            systemctl is-active postgresql
            PGPASSWORD="$DB_PASS" psql -h 127.0.0.1 -U kumbuild -d kumbuild -c 'SELECT current_database(), current_user;'
            sudo -u postgres psql -c "SHOW shared_buffers; SHOW max_connections;"
            free -h
            ls -l /etc/kumbuild/db-password
            echo "SETUP-POSTGRES-OK"
