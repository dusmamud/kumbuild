# Kumbuild — deploy kumbuild-blog (Astro 7) to Cloudflare Pages.
# Project `kumbuild-blog` pehle se bana hua hai (Dus ne banaya);
# custom domain blog.kumbuild.com production me Dus khud add karega.
# Trigger: push to main (blog ya shared packages badle to) ya manual.
name: Deploy blog

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/blog/**"
      - "frontend/packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kumbuild-blog build
      - run: pnpm exec wrangler pages deploy frontend/apps/blog/dist --project-name=kumbuild-blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
