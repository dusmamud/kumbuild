# Kumbuild — deploy kumbuild-web (Astro) to Cloudflare Pages.
# Trigger: push to main (web ya shared packages badle to) ya manual dispatch.
# NOTE (verified is repo me): git-database API se kiye gaye push `push`
# trigger CHALATE hain (runs 42619040220, 42621871402 push-triggered) —
# Creestion wala gotcha yahan lagu nahi hota. Har main push par ye
# workflow apne aap chalta hai; workflow_dispatch sirf manual backup hai.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/web/**"
      - "frontend/packages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kumbuild-web build
      - run: pnpm exec wrangler pages deploy frontend/apps/web/dist --project-name=kumbuild-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
