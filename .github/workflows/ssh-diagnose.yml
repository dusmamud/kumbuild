# One-off SSH diagnosis for the Dusrel-chat VPS (80.225.209.75).
# Every step has a hard timeout so a hung SSH can never block the run.
# Run manually: Actions -> Diagnose VPS SSH -> Run workflow.
# Deletes itself after the diagnosis is done (remove this file in a
# follow-up commit once SSH works).
name: Diagnose VPS SSH

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: TCP check port 22
        run: |
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22 && echo TCP-OPEN' || echo TCP-FAILED-OR-TIMEOUT
      - name: SSH banner check
        run: |
          timeout 15 bash -c 'exec 3<>/dev/tcp/${{ secrets.VPS_HOST }}/22 && head -c 200 <&3; echo' || echo BANNER-FAILED-OR-TIMEOUT
      - name: SSH verbose with key
        run: |
          mkdir -p ~/.ssh && printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps.key && chmod 600 ~/.ssh/vps.key
          timeout 30 ssh -vvv -i ~/.ssh/vps.key -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o ServerAliveCountMax=2 -o ServerAliveInterval=5 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'echo SSH-OK; hostname; uptime; free -h; systemctl is-active sshd' || echo "SSH-FAILED exit=$?"
          rm -f ~/.ssh/vps.key
