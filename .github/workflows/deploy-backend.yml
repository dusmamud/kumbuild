# Kumbuild — deploy backend (Go API) to the Oracle VPS.
#
# Oracle Linux 9 (Dusrel-chat, E2.1.Micro, 1 GB RAM) — dnf/rpm, NOT
# Debian/Ubuntu apt-get/dpkg. Dev only, NO custom domain: the API is
# exposed through a Cloudflare Quick Tunnel (random trycloudflare.com
# URL, changes on every restart). Named tunnel / api.kumbuild.com is
# prod-only, after the domain is bought.
#
# Secrets needed (GitHub repo Settings -> Secrets and variables -> Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT, BREVO_API_KEY,
#   TURNSTILE_SECRET_KEY, REDIS_PASSWORD, COOKIE_DOMAIN, ALLOWED_ORIGINS,
#   APP_BASE_URL
# VPS_* are set. CLOUDFLARE_TUNNEL_TOKEN is NOT needed for dev (named
# tunnel only). DATABASE_URL is NOT a GitHub secret: it is built on the VPS
# itself from /etc/kumbuild/db-password (0600, created by setup-postgres) so
# the DB password never leaves the VPS and is never stored in GitHub.
# None of these values appear in this file — only secrets.* placeholders.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Vet
        run: go vet ./...
        working-directory: backend
      - name: Build all packages
        run: go build ./...
        working-directory: backend
      - name: Test
        run: go test -p 1 ./... -count=1
        working-directory: backend
      - name: Build API binary
        run: go build -o kumbuild-api ./cmd/api
        working-directory: backend
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kumbuild-api
          path: backend/kumbuild-api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: kumbuild-api
          path: backend/kumbuild-api-bin
      - name: Pre-clean stale processes on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "--- pre-clean: kill orphaned dnf/rpm from killed runs (a killed deploy left dnf running before) ---"
            free -h
            if pgrep -x dnf >/dev/null 2>&1; then
              echo "stale dnf found, killing it"
              sudo pkill -x dnf || true
              sleep 5
            fi
            sudo pkill -x rpm || true
            sudo rm -f /var/cache/dnf/*lock* /var/lib/dnf/rpmdb_lock.pid 2>/dev/null || true
            free -h
            echo "PRE-CLEAN-OK"
      - name: Copy artefacts to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          source: "backend/kumbuild-api-bin/kumbuild-api,backend/deploy/kumbuild-api.service,backend/deploy/cloudflared.service,backend/deploy/redis.conf"
          target: "/tmp/kumbuild-deploy"
          strip_components: 2
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            # (a) Install Go 1.27 if missing (tarball is distro-neutral).
            if ! command -v go >/dev/null 2>&1; then
              curl -fsSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o /tmp/go.tgz
              sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
            fi
            # (b) Install Redis + cloudflared on Oracle Linux 9 (dnf/rpm).
            # OL9 AppStream has no Redis — it comes from EPEL. Service
            # name on OL9 is `redis`, not `redis-server`.
            if ! command -v redis-server >/dev/null 2>&1; then
              sudo dnf --disablerepo=ol9_ksplice,ol9_oci_included --setopt=timeout=30 --setopt=minrate=1000 --setopt=max_parallel_downloads=1 -v install -y oracle-epel-release-el9 || sudo dnf --disablerepo=ol9_ksplice,ol9_oci_included --setopt=timeout=30 --setopt=minrate=1000 --setopt=max_parallel_downloads=1 -v install -y epel-release
              sudo dnf --disablerepo=ol9_ksplice,ol9_oci_included --setopt=timeout=30 --setopt=minrate=1000 --setopt=max_parallel_downloads=1 -v install -y redis
            fi
            if ! command -v cloudflared >/dev/null 2>&1; then
              curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-x86_64.rpm -o /tmp/cloudflared.rpm
              sudo dnf --disablerepo=ol9_ksplice,ol9_oci_included --setopt=timeout=30 --setopt=minrate=1000 --setopt=max_parallel_downloads=1 -v install -y /tmp/cloudflared.rpm
            fi
            # (c) Apply deploy/redis.conf, injecting REDIS_PASSWORD from secrets via sed.
            # NOTE: a password containing '|' would need escaping.
            sudo mkdir -p /etc/redis
            sudo cp /tmp/kumbuild-deploy/redis.conf /etc/redis/redis.conf
            sudo sed -i "s|^# requirepass .*|requirepass ${{ secrets.REDIS_PASSWORD }}|" /etc/redis/redis.conf
            # (d) Ensure the kumbuild OS user exists, then copy artefacts into place.
            id kumbuild >/dev/null 2>&1 || sudo useradd -m -s /bin/bash kumbuild
            sudo install -d -o kumbuild -g kumbuild /opt/kumbuild /etc/kumbuild
            sudo install -m 0755 /tmp/kumbuild-deploy/kumbuild-api /opt/kumbuild/kumbuild-api
            sudo install -m 0644 /tmp/kumbuild-deploy/kumbuild-api.service /etc/systemd/system/kumbuild-api.service
            sudo install -m 0644 /tmp/kumbuild-deploy/cloudflared.service /etc/systemd/system/cloudflared.service
            # (e) Write /etc/kumbuild/api.env from GitHub Secrets (real secrets live here only).
            # Dev: APP_ENV=dev, cookie SameSite=None + Secure, no Domain,
            # COOKIE_DOMAIN empty, APP_BASE_URL = Quick Tunnel URL.
            # DATABASE_URL is built on-box from /etc/kumbuild/db-password
            # (setup-postgres created it, 0600) — the DB password never
            # leaves the VPS and is never a GitHub secret.
            DB_PASS=$(sudo cat /etc/kumbuild/db-password)
            sudo tee /etc/kumbuild/api.env >/dev/null <<EOF
            APP_ENV=dev
            PORT=8080
            DATABASE_URL=postgres://kumbuild:${DB_PASS}@localhost:5432/kumbuild
            REDIS_ADDR=localhost:6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            EOF
            sudo chmod 0600 /etc/kumbuild/api.env
            sudo chown kumbuild:kumbuild /etc/kumbuild/api.env
            # (f) Quick Tunnel (dev, no custom domain): cloudflared.service
            # in the repo already runs `cloudflared tunnel --url
            # http://localhost:8080`. No named tunnel, no config.yml,
            # no credentials.json, no api.kumbuild.com in dev.
            sudo rm -rf /etc/cloudflared/config.yml /etc/cloudflared/token
            # (g) Reload systemd and restart services (redis, not redis-server, on OL9).
            sudo systemctl daemon-reload
            sudo systemctl enable --now redis kumbuild-api cloudflared
            sudo systemctl restart redis kumbuild-api cloudflared
            # (h) Smoke check: the API must answer its health endpoint locally.
            curl -fsS http://localhost:8080/healthz
