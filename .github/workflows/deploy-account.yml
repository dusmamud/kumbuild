# Kumbuild — deploy kumbuild-account (React+Vite) to Cloudflare Pages.
# Trigger: push to main (account app ya shared packages badle to) ya manual dispatch.
# NOTE: the Pages project `kumbuild-account` must exist in the Cloudflare
# dashboard (created by Dus) — wrangler does NOT auto-create it; until
# then this run fails. Same pattern as deploy-web.yml.
name: Deploy account

on:
  push:
    branches: [main]
    paths:
      - "frontend/apps/account/**"
      - "frontend/packages/**"
      - ".github/workflows/deploy-account.yml"
  workflow_dispatch:

jobs:
  deploy-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kumbuild-account build
      - run: pnpm exec wrangler pages deploy frontend/apps/account/dist --project-name=kumbuild-account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
