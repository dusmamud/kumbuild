# One-off: sync /etc/kumbuild/api.env APP_BASE_URL with the CURRENT
# Cloudflare Quick Tunnel URL (read from the cloudflared journal on the
# VPS) and restart ONLY kumbuild-api — cloudflared is NOT restarted, so
# the tunnel URL itself does not rotate. Publishes the result as a
# "vps-check" commit status (URL + api.env APP_BASE_URL length only).
name: Sync APP_BASE_URL

on:
  workflow_dispatch:

permissions:
  statuses: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync APP_BASE_URL on VPS
        id: sync
        run: |
          mkdir -p ~/.ssh && printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps.key && chmod 600 ~/.ssh/vps.key
          ssh -i ~/.ssh/vps.key -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' > sync-output.txt 2>&1 <<'REMOTE' || true
          set +e
          TUN=$(sudo journalctl -u cloudflared --no-pager | grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" | grep -v "api\.trycloudflare\.com" | tail -1)
          echo "TUNNEL_URL=$TUN"
          if [ -n "$TUN" ]; then
            sudo sed -i "s|^APP_BASE_URL=.*|APP_BASE_URL=$TUN|" /etc/kumbuild/api.env
            sudo systemctl restart kumbuild-api
            sleep 3
          fi
          systemctl is-active kumbuild-api cloudflared
          curl -fsS http://localhost:8080/healthz && echo " HEALTHZ-OK" || echo "HEALTHZ-FAILED"
          echo "ENV_LINE=$(sudo awk -F= '/^APP_BASE_URL=/{printf "APP_BASE_URL len=%d", length(substr($0, index($0,"=")+1))}' /etc/kumbuild/api.env)"
          if [ -n "$TUN" ]; then curl -fsS "$TUN/healthz" && echo " TUNNEL-HEALTHZ-OK" || echo "TUNNEL-HEALTHZ-FAILED"; fi
          echo "SYNC-DONE"
          REMOTE
          rm -f ~/.ssh/vps.key
          cat sync-output.txt
          {
            echo "## APP_BASE_URL sync"
            echo '```'
            cat sync-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          TUN=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" sync-output.txt | grep -v "api\.trycloudflare\.com" | tail -1)
          HEALTH=$(grep -q "HEALTHZ-OK" sync-output.txt && echo ok || echo FAIL)
          TUNHEALTH=$(grep -q "TUNNEL-HEALTHZ-OK" sync-output.txt && echo ok || echo FAIL)
          ENVLEN=$(grep -oE "APP_BASE_URL len=[0-9]+" sync-output.txt | tail -1)
          echo "summary=health:$HEALTH tunnel-health:$TUNHEALTH $ENVLEN $TUN" >> "$GITHUB_OUTPUT"
      - name: Publish sync result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          STATE=success
          case "$SUMMARY" in *FAIL*) STATE=failure;; esac
          DESC=$(printf '%s' "$SUMMARY" | cut -c1-140)
          PAYLOAD=$(jq -n --arg s "$STATE" --arg c "vps-check" --arg d "$DESC" '{state:$s, context:$c, description:$d}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$PAYLOAD" >/dev/null
