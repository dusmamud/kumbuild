# Kumbuild — PR check: dono apps build hote hain ya nahi, deploy nahi hota.
# Sirf lint + build — production deploy nahi hoga.
name: PR check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kumbuild-web build
      - run: pnpm --filter kumbuild-app build
