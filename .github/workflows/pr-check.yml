# Kumbuild — PR check: saaton apps build hote hain ya nahi, deploy nahi hota.
# Sirf build — production deploy nahi hoga. (Lint ka koi step nahi hai:
# sirf kumbuild-app me "lint" script hai, baaki 6 apps me nahi.)
name: PR check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter kumbuild-web build
      - name: Build account
        run: pnpm --filter kumbuild-account build
      - name: Build admin
        run: pnpm --filter kumbuild-admin build
      - name: Build home
        run: pnpm --filter kumbuild-home build
      - name: Build blog
        run: pnpm --filter kumbuild-blog build
      - name: Build docs
        run: pnpm --filter kumbuild-docs build
      - name: Build app (legacy)
        run: pnpm --filter kumbuild-app build
