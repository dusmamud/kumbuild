# Kumbuild — PR check: teeno apps (web, blog, docs) build hote hain ya nahi,
# deploy nahi hota. Sirf build — production deploy nahi hoga.
# (account/admin/app/home apps 2026-11-21 ko repo se hata diye gaye hain —
# woh ab alag projects me banenge, isliye unke build steps bhi hata diye.)
name: PR check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter kumbuild-web build
      - name: Build blog
        run: pnpm --filter kumbuild-blog build
      - name: Build docs
        run: pnpm --filter kumbuild-docs build
